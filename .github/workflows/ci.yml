name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify stage-0 scaffold
        shell: bash
        run: bash verify.sh --scaffold-only
      - name: Reject committed local secrets
        shell: bash
        run: bash scripts/check-secrets.sh
      - name: Validate startup script syntax
        shell: bash
        run: |
          bash -n start.sh
          pwsh -NoProfile -Command '[void][scriptblock]::Create((Get-Content -Raw ./start.ps1))'

  backend-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: classroom_review_test
          POSTGRES_USER: classroom_review_test
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U classroom_review_test -d classroom_review_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://classroom_review_test:ci-test-password@localhost:5432/classroom_review_test
    steps:
      - uses: actions/checkout@v4
      - name: Use Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install backend and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify database migration round trip
        run: |
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini downgrade base
          python -m alembic -c backend/alembic.ini upgrade head
        env:
          APP_ENV: test
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          JWT_SECRET: ci-only-jwt-secret-at-least-thirty-two-characters
          WORKER_SERVICE_TOKEN: ci-only-worker-service-token
          AGENT_SERVICE_TOKEN: ci-only-agent-service-token
          OBJECT_STORAGE_ENDPOINT: http://localhost:9000
          OBJECT_STORAGE_BUCKET: ci-test-bucket
          OBJECT_STORAGE_ACCESS_KEY_ID: ci-test-access-key
          OBJECT_STORAGE_SECRET_ACCESS_KEY: ci-test-secret-key
      - name: Verify migration metadata is current
        run: python -m alembic -c backend/alembic.ini check
        env:
          APP_ENV: test
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          JWT_SECRET: ci-only-jwt-secret-at-least-thirty-two-characters
          WORKER_SERVICE_TOKEN: ci-only-worker-service-token
          AGENT_SERVICE_TOKEN: ci-only-agent-service-token
          OBJECT_STORAGE_ENDPOINT: http://localhost:9000
          OBJECT_STORAGE_BUCKET: ci-test-bucket
          OBJECT_STORAGE_ACCESS_KEY_ID: ci-test-access-key
          OBJECT_STORAGE_SECRET_ACCESS_KEY: ci-test-secret-key
      - name: Run backend tests
        run: python -m pytest -q
      - name: Run backend and Agent lint
        run: python -m ruff check backend agent tests

  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Run frontend contract tests
        run: npm test
      - name: Validate browser E2E specification
        run: npm run test:e2e:real
      - name: Run TypeScript checks
        run: npm run typecheck
      - name: Build production frontend
        run: npm run build
      - name: Reject high-severity dependency advisories
        run: npm audit --audit-level=high
