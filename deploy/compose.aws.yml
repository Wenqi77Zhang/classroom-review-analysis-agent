services:
  minio:
    image: quay.io/minio/minio:latest
    command: ["server", "/data"]
    env_file:
      - ../.env.production
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_ACCESS_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: ${FRONTEND_ORIGIN}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s
    restart: unless-stopped
    networks: [private]

  minio-init:
    image: quay.io/minio/mc:latest
    env_file:
      - ../.env.production
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        until mc alias set classroom http://minio:9000
        "$${OBJECT_STORAGE_ACCESS_KEY_ID}" "$${OBJECT_STORAGE_SECRET_ACCESS_KEY}";
        do sleep 2; done;
        mc mb --ignore-existing "classroom/$${OBJECT_STORAGE_BUCKET}";
        mc anonymous set none "classroom/$${OBJECT_STORAGE_BUCKET}"
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks: [private]

  backend:
    depends_on:
      minio-init:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks: [private, egress]

  ollama-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        until ollama list >/dev/null 2>&1; do sleep 2; done;
        ollama pull "$${LOCAL_MODEL_NAME}"
    env_file:
      - ../.env.production
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    networks: [private]

  worker:
    depends_on:
      backend:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

  agent:
    depends_on:
      backend:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
      OBJECT_STORAGE_PUBLIC_HOST: ${OBJECT_STORAGE_PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.aws:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks: [public, private]

volumes:
  minio_data:
  ollama_data:
  caddy_data:
  caddy_config:
