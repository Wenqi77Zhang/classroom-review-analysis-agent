services:
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks: [private, egress]

  ollama-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        until ollama list >/dev/null 2>&1; do sleep 2; done;
        ollama pull "$${LOCAL_MODEL_NAME}"
    env_file:
      - ../.env.production
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    networks: [private]

  worker:
    depends_on:
      backend:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

  agent:
    depends_on:
      backend:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.aws:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks: [public]

volumes:
  ollama_data:
  caddy_data:
  caddy_config:
