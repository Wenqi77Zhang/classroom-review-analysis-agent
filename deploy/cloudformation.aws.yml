AWSTemplateFormatVersion: "2010-09-09"
Description: Single-host production candidate for Classroom Review Analysis Agent

Parameters:
  InstanceType:
    Type: String
    Default: t3a.xlarge
    AllowedValues:
      - t3a.large
      - t3a.xlarge
    Description: t3a.xlarge is recommended for local Ollama plus Whisper; t3a.large is slower.
  RepositoryUrl:
    Type: String
    Default: https://github.com/Wenqi77Zhang/classroom-review-analysis-agent.git
    AllowedPattern: ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\.git$
  RepositoryRef:
    Type: String
    Default: main
    AllowedPattern: ^[A-Za-z0-9._/-]+$
  UbuntuAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.44.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: classroom-review-agent

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Vpc

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.44.0.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: classroom-review-agent-public

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet

  HostRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Project
          Value: classroom-review-agent

  HostInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref HostRole]

  HostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS only; administration uses SSM Session Manager
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: udp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: classroom-review-agent

  Host:
    Type: AWS::EC2::Instance
    DependsOn: DefaultPublicRoute
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref HostInstanceProfile
      SecurityGroupIds: [!GetAtt HostSecurityGroup.GroupId]
      SubnetId: !Ref PublicSubnet
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: 100
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: classroom-review-agent
        - Key: Project
          Value: classroom-review-agent
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates git
          git clone --depth 1 --branch '${RepositoryRef}' '${RepositoryUrl}' /tmp/classroom-review-bootstrap
          chmod 700 /tmp/classroom-review-bootstrap/deploy/aws-bootstrap.sh
          REPOSITORY_URL='${RepositoryUrl}' REPOSITORY_REF='${RepositoryRef}' \
            /tmp/classroom-review-bootstrap/deploy/aws-bootstrap.sh

  PublicAddress:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: classroom-review-agent

  PublicAddressAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt PublicAddress.AllocationId
      InstanceId: !Ref Host

Outputs:
  PublicIp:
    Value: !Ref PublicAddress
  PublicHost:
    Value: !Sub "${PublicAddress}.sslip.io"
    Description: Set PUBLIC_HOST to this value; Caddy obtains HTTPS automatically.
  SessionManager:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/systems-manager/fleet-manager/managed-nodes/${Host}"
