[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "classroom-review-analysis-agent"
version = "0.0.0"
description = "Evidence-grounded classroom review and teaching analysis agent."
requires-python = ">=3.13,<3.14"
# 版本策略：给下界与主版本上界，不做精确锁定。四天集中开发期需要
# 三个成员各自追加依赖，精确锁定会频繁互相冲突；主版本上界足以拦住
# 破坏性升级。已解析并验证过的版本记录在 backend/backend-module-guide.md。
dependencies = [
  # 平台后端（成员 3）
  "fastapi>=0.140,<1.0",
  "uvicorn[standard]>=0.51,<1.0",
  "pydantic>=2.13,<3.0",
  "pydantic-settings>=2.14,<3.0",
  "sqlalchemy[asyncio]>=2.0.51,<2.1",
  "asyncpg>=0.31,<1.0",
  "alembic>=1.18,<2.0",
  "pyjwt>=2.13,<3.0",
  "argon2-cffi>=25.1,<26.0",
  "boto3>=1.43,<2.0",
  # TODO(成员 5)：Agent 模型与可观测依赖在此追加。
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10.0",
  "pytest-asyncio>=1.4,<2.0",
  "httpx>=0.28,<1.0",
  # ruff 跨小版本会调整规则集，锁到小版本让 CI 结果稳定。
  "ruff>=0.16,<0.17",
]
worker = [
  # 本地 ASR 运行时；模型权重运行时下载，不进入仓库，也不拖累纯后端 CI。
  # Whisper 使用 YYYYMMDD 日期版本；上界也必须使用同一量级。
  "openai-whisper>=20250625,<20270000",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["backend", "worker", "agent"]

[tool.ruff]
line-length = 100
