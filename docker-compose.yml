# 可选的本地基础服务。第一负责人：成员 5；minio 部分由成员 3 提出（需成员 5 确认）。
# 启动：docker compose --profile local-infra up -d
services:
  postgres:
    image: postgres:17-alpine
    profiles: ["local-infra"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 【离线开发替代品，不是 M1 交付目标】
  # M1 的对象存储方案是 Backblaze B2（走其 S3 兼容 API），由成员 1 确定。
  # 这里的 MinIO 只用于尚无 B2 应用密钥、或需要离线开发时先跑通上传链路：
  # 视频必须进对象存储、数据库只存对象地址，本地用 MinIO 复现同一约束，
  # 避免"本地写磁盘、上线换 S3"导致的行为差异。
  # 两者的寻址差异（MinIO 需 path-style，B2 用 virtual-host）必须由后端的统一
  # S3 Provider 抽象层吸收，业务层不得直接依赖任一供应商。
  # 用 MinIO 时需把 OBJECT_STORAGE_ENDPOINT 指向 http://localhost:9000 并设
  # OBJECT_STORAGE_USE_PATH_STYLE=true。
  # TODO(成员 3)：首次拉取后把 latest 换成具体 RELEASE 标签，保证可复现。
  minio:
    image: minio/minio:latest
    profiles: ["local-infra"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_ACCESS_KEY}
      # 浏览器直传需要 CORS。收紧到前端来源而不是 *：预签名 URL 本身已是凭据，
      # 没有理由让任意站点发起带该凭据的请求。
      MINIO_API_CORS_ALLOW_ORIGIN: ${FRONTEND_ORIGIN}
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # 控制台
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 一次性任务：建桶。桶不存在时预签名上传会直接失败，交给人工建容易漏。
  minio-init:
    image: minio/mc:latest
    profiles: ["local-infra"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_ACCESS_KEY}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${OBJECT_STORAGE_BUCKET} &&
      mc anonymous set none local/$${OBJECT_STORAGE_BUCKET} &&
      echo 'bucket ready: '$${OBJECT_STORAGE_BUCKET}
      "

volumes:
  postgres_data:
  minio_data:
